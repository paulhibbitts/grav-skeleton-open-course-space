streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '': [user/themes/mytheme, user/themes/quark2-open-publishing, user/themes/quark2]
# Auto mode (Light or Dark, as the visitor's system), and the Open Course Space accent colour (slate blue)
theme-mode: auto
accent-color: '#3b5682'
chromeless:
  enabled: false
display_of_git_sync_repo_link: menu
type_of_git_sync_repo_link: view
markdown_link:
  enabled: false
  location: page
  hide_templates:
    - blog
    - section-list
    - reader-list
    - course-list
    - search
    - simplesearch_results
h5pembedrootpath: 'https://h5p.org/h5p/embed/'
cc_license:
  enabled: false
  type: ccby
  icon: false
displaycustommenus:
  enabled: false
hidehomemenulink: true
production-mode: true
header-fixed: true
header-animated: true
header-dark: false
header-transparent: false
sticky-footer: true
blog-page: /blog
spectre:
  exp: false
  icons: false
grid-size: grid-lg
git_sync_edit_note_text: 'Have a suggestion or correction?'
menu:
  -
    text: Grav
    icon: arrow-circle-right
    url: 'https://getgrav.org/'
    target: _blank
dropdown:
  enabled: false
# lighter headings, or quark2 for Quark 2's bolder default
heading_weight: lighter
