streams:
 schemes:
   theme:
     type: ReadOnlyStream
     prefixes:
       '':
       - user/themes/mytheme
       - user/themes/quark2-open-publishing
       - user/themes/quark2
# Auto mode (Light or Dark, as the visitor's system), and the Open Course Space accent colour (slate blue)
theme-mode: auto
accent-color: '#3b5682'
fontawesome:
  enabled: true
  local: false
